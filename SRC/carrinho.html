  <main>
    <h2>Seu Carrinho</h2>
    <div id="lista-carrinho" class="carrinho-container"></div>
    <p id="total"></p>
    <button onclick="finalizarCompra()">Finalizar Compra</button>
  </main>

  <footer>
    <p>© 2025 Cãopanheiros PetStore LTDA</p>
  </footer>

  <script src="js/script.js"></script>
  <script>
    (function () {
      const nf = v => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

      function getCart() { try { return JSON.parse(localStorage.getItem('carrinho')) || [] } catch (e) { return [] } }
      function setCart(c) { localStorage.setItem('carrinho', JSON.stringify(c)); window.carrinho = c; }

      window.carrinho = Array.isArray(window.carrinho) ? window.carrinho : getCart();

      function exibirCarrinho() {
        const container = document.getElementById("lista-carrinho");
        const totalEl = document.getElementById("total");
        const cart = getCart();
        container.innerHTML = "";

        if (!cart.length) {
          totalEl.textContent = "Total: " + nf(0);
          container.innerHTML = "<p>Seu carrinho está vazio 🐶</p>";
          return;
        }

        let soma = 0;
        cart.forEach(item => {
          const subtotal = (item.preco || 0) * (item.quantidade || 1);
          soma += subtotal;

          const div = document.createElement("div");
          div.classList.add("item-carrinho");
          div.innerHTML = `
        <img src="${item.imagem || ''}" alt="${item.nome || ''}" class="img-carrinho">
        <div class="info-carrinho">
          <h3>${item.nome || ''}</h3>
          <p>Preço: ${nf(item.preco || 0)}</p>
          <p>Subtotal: ${nf(subtotal)}</p>
          <div class="controles">
            <button class="qty-btn" onclick="alterarQuantidade('${item.id}', -1)">➖</button>
            <span>${item.quantidade || 1}</span>
            <button class="qty-btn" onclick="alterarQuantidade('${item.id}', 1)">➕</button>
            <button class="remover" onclick="removerItem('${item.id}')">❌ Remover</button>
          </div>
        </div>
      `;
          container.appendChild(div);
        });

        totalEl.textContent = "Total: " + nf(soma);
      }

      function alterarQuantidade(id, delta) {
        const cart = getCart();
        const item = cart.find(p => p.id === id);
        if (!item) return;
        item.quantidade = Math.max(0, (item.quantidade || 1) + delta);
        const novo = item.quantidade === 0 ? cart.filter(p => p.id !== id) : cart;
        setCart(novo);
        exibirCarrinho();
      }

      function removerItem(id) {
        const cart = getCart().filter(p => p.id !== id);
        setCart(cart);
        exibirCarrinho();
      }

      function finalizarCompra() {
        const cart = getCart();
        if (!cart.length) { alert("Seu carrinho está vazio!"); return; }
        alert("Compra finalizada com sucesso!");
        setCart([]);
        exibirCarrinho();
      }

      window.alterarQuantidade = alterarQuantidade;
      window.removerItem = removerItem;
      window.finalizarCompra = finalizarCompra;

      exibirCarrinho();
    })();
  </script>


</body>
