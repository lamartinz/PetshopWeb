<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Cãopanheiros PetStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Cãopanheiros PetStore</h1>
    <nav>
        <a href="index.html">Inicio</a>
    </nav>
  </header>

  <main>
    <div class="cadastro-layout">
      <div class="cadastro-container">
        <div class="BemVindo">
          <h2>Bem-vindo(a) à Cãopanheiros!</h2>
          <p>Faça seu cadastro e tenha acesso aos seus favoritos.</p>
          <a href="login.html" class="btn">Já tenho conta</a>
        </div>
        <div class="form-side">
          <h2>Criar Conta</h2>
          <form method="POST" action="backend/registrar.php">
            <input type="text" name="nome" placeholder="Nome Completo" required>
            <input type="email" name="email" placeholder="E-mail" required>
            <input type="password" name="senha" placeholder="Senha" required>
            <button type="submit" class="btn">Cadastrar</button>
          </form>
          <p>Já tem conta? <a href="login.html">Faça login</a></p>
        </div>
      </div>
    </div> 
  </main>

  <footer>
    <p>© 2025 Cãopanheiros PetStore LTDA</p>
  </footer>
</body>
</html>
