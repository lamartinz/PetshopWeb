<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedido confirmado - Cãopanheiros</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .ok-wrap{max-width:760px;margin:40px auto;padding:24px;background:#fff;border:1px solid var(--muted);border-radius:14px;text-align:center}
    .ok-wrap h2{font-family:'Baloo 2','Fredoka One',cursive;color:var(--brand-strong);margin:0 0 8px}
    .ok-wrap p{margin:6px 0}
    .ok-sum{margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
    .ok-sum .pill{padding:10px 14px;border:1px solid var(--muted);border-radius:999px;background:#fff}
    .ok-actions{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  </style>
</head>
<body>
  <header>
    <h1>Cãopanheiros PetStore</h1>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar produtos...">
      <button id="searchBtn">🔍</button>
    </div>
  </header>

  <div class="ok-wrap">
    <h2>Pedido confirmado! 🐾</h2>
    <p>Enviamos os detalhes para o seu e-mail.</p>
    <div id="ok-info"></div>
    <div class="ok-actions">
      <a href="index.html" class="btn">Voltar para a loja</a>
      <a href="produtos.html" class="btn-outline">Ver mais produtos</a>
    </div>
  </div>

  <footer><p>© 2025 Cãopanheiros PetStore LTDA</p></footer>
  <script>
    const nf=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    document.addEventListener('DOMContentLoaded',()=>{
      const info=document.getElementById('ok-info');
      try{
        const p=JSON.parse(localStorage.getItem('ultimo_pedido')||'null');
        if(!p){ info.innerHTML='<p>Não encontramos o seu pedido.</p>'; return; }
        info.innerHTML = `
          <div class="ok-sum">
            <div class="pill">Itens: ${p.itens.length}</div>
            <div class="pill">Subtotal: ${nf(p.subtotal)}</div>
            <div class="pill">Frete: ${nf(p.frete)}</div>
            <div class="pill">Total: <strong>${nf(p.total)}</strong></div>
            <div class="pill">Pagamento: ${p.pagamento==='pix'?'Pix':'Cartão'}</div>
          </div>
          <p style="margin-top:10px;">Entrega para: <strong>${p.cliente?.nome||''}</strong> — ${p.cliente?.endereco||''}, ${p.cliente?.bairro||''}, ${p.cliente?.cidade||''} - ${p.cliente?.uf||''}</p>
        `;
      }catch(e){
        info.textContent='Erro ao carregar o pedido.';
      }
    });
  </script>
  <script src="js/script.js" defer></script>
</body>
</html>
